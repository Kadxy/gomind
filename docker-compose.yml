# App only: static frontend + WebSocket relay on one port.
#   cp .env.example .env     # set BIND to where your reverse proxy points
#   docker compose up -d --build
# Already have a reverse proxy terminating TLS? Point it at BIND and
# make sure it forwards WebSocket upgrades (see README). No proxy yet? Add
# the bundled Caddy with:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
services:
  gomind:
    build: .
    image: gomind:latest
    container_name: gomind
    restart: unless-stopped
    environment:
      # Comma-separated `Origin` allowlist for WebSocket upgrades; '*' = any.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      # host[:port] -> container 8000. Default binds loopback only, for a
      # reverse proxy on the same box.
      - '${BIND:-127.0.0.1:8000}:8000'
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
